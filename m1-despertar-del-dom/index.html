<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caza-Bugs</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Caza-Bugs 🐛</h1>
  <p>Haz clic en el bug antes de que se escape. Tienes 20 segundos.</p>

  <input type="text" id="nombre" placeholder="Tu nombre">
  <button id="boton">Empezar</button>

  <p>Puntos: <span id="puntos">0</span> · Tiempo: <span id="tiempo">20</span></p>

  <!-- Las casillas se crean desde main.js -->
  <div id="tablero"></div>

  <p id="mensaje">Escribe tu nombre y pulsa Empezar.</p>
  <p class="pista">Pista: hay una tecla secreta que apaga la luz…</p>
</body>
</html>
