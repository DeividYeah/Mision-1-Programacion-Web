<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>El oráculo de los números</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>El oráculo de los números</h1>
  <p>Estoy pensando un número del 1 al 100. ¿Cuál es?</p>

  <input type="number" id="numero" min="1" max="100">
  <button id="boton">Consultar</button>

  <p id="mensaje"></p>
  <p id="intentos">Intentos: 0</p>
</body>
</html>
